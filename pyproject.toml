[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmscope"
version = "0.1.0"
description = "Tracing, LLM-native metrics, cost control, caching and context compaction for LLM apps"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
otel = ["opentelemetry-sdk>=1.24"]
semantic = ["fastembed>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "opentelemetry-sdk>=1.24"]

[project.scripts]
llmscope = "llmscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmscope = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
